services:
  - type: web
    name: revisa-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: REVISA Platform API
      - key: APP_VERSION
        value: 2.0.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@revisa.local
      - key: DEFAULT_ADMIN_PASSWORD
        value: Admin@12345
      - key: DEMO_SEED_ON_START
        value: "false"
      - key: DEMO_SEED_FORCE_RESET
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        value: redis://localhost:6379/0
